services:
  server:
    build: ./server
    ports: ["4000:4000"]
    environment:
      - PORT=4000
      - JWT_SECRET=campusride-prod-secret
      - CLIENT_ORIGIN=http://localhost:5173
    volumes:
      - rides-data:/app
  client:
    build: ./client
    ports: ["5173:80"]
    depends_on: [server]
volumes:
  rides-data:
